logLevel: info

rtmp: yes
rtmpAddress: :1935

rtsp: yes
rtspAddress: :8559

hls: yes
hlsAddress: :8888

webrtc: yes
webrtcAddress: :8889

api: yes
apiAddress: :9997

paths:
  depth: {}
  rgb: {}
  # Pull the camera's H.264 RTSP stream, re-encode to a low-latency baseline
  # profile, and republish it into this path for the WebRTC (WHEP) HUD feed.
  # NOTE: source: expects a URL, not a command — an ffmpeg pipeline must run via
  # runOnInit. $RTSP_PORT is substituted by MediaMTX (matches rtspAddress above).
  front_clean:
    runOnInit: ffmpeg -i rtsp://192.168.144.25:8554/main.264 -c:v libx264 -preset ultrafast -profile:v baseline -tune zerolatency -f rtsp rtsp://localhost:$RTSP_PORT/front_clean
    runOnInitRestart: yes