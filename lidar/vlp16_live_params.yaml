# Live Velodyne driver parameters.
# An empty device_ip allows packets from any source address, which is required
# when macOS relay traffic is re-emitted from localhost inside the container.
velodyne_driver_node:
  ros__parameters:
    device_ip: ""
    gps_time: false
    time_offset: 0.0
    enabled: true
    read_once: false
    read_fast: false
    repeat_delay: 0.0
    frame_id: velodyne
    model: VLP16
    rpm: 600.0
    port: 2368
    timestamp_first_packet: false
