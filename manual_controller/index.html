<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Control Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🚁 Drone Control Panel</h1>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">System Ready</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Screens Grid -->
            <div class="screens-grid">
                <!-- Depth Camera Screen -->
                <div class="screen" id="depth-camera">
                    <div class="screen-header">
                        <h2>Depth Camera Feed</h2>
                        <div class="screen-info">
                            <span class="info-badge" id="depth-stream-status">Connecting...</span>
                            <span class="info-badge">Depth Stream</span>
                        </div>
                    </div>
                    <div class="camera-container">
                        <div class="camera-feed live-feed">
                            <img
                                id="depth-camera-stream"
                                class="live-camera-stream"
                                src=""
                                alt="Depth camera stream"
                            >
                            <div class="stream-overlay" id="depth-camera-overlay">
                                <div class="placeholder-text">Depth Camera Stream</div>
                                <div class="placeholder-subtext">Waiting for Jetson feed...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RTSP Camera Screen -->
                <div class="screen" id="rtsp-camera">
                    <div class="screen-header">
                        <h2>RTSP Camera Feed</h2>
                        <div class="screen-info">
                            <span class="info-badge">Resolution: 1920x1080</span>
                            <span class="info-badge">FPS: 30</span>
                        </div>
                    </div>
                    <div class="camera-container">
                        <div class="camera-feed">
                            <div class="placeholder-image rtsp-placeholder">
                                <div class="placeholder-text">RTSP Camera Stream</div>
                                <div class="placeholder-subtext">Waiting for connection...</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Control Panel -->
        <footer class="control-panel">
            <div class="control-buttons">
                <button class="control-btn screenshot-btn" id="screenshot-btn">
                    <span class="btn-icon">📸</span>
                    <span class="btn-text">Screenshot</span>
                </button>
                <button class="control-btn release-payload-btn" id="release-payload-btn">
                    <span class="btn-icon">📦</span>
                    <span class="btn-text">Release Payload</span>
                </button>
                <button class="control-btn small-payload-btn" id="small-payload-btn">
                    <span class="btn-icon">📦</span>
                    <span class="btn-text">Small Payload</span>
                </button>
                <button class="control-btn spray-water-btn" id="spray-water-btn">
                    <span class="btn-icon">💧</span>
                    <span class="btn-text">Spray Water</span>
                </button>
            </div>
        </footer>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
